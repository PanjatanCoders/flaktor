[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "flaktor"
version = "0.1.0"
description = "Framework-agnostic flaky test intelligence tool - Track, analyze, and fix flaky tests"
authors = [
    { name = "Panjatan Labs", email = "panjatan.tech@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["testing", "flaky-tests", "qa", "ci-cd", "junit", "cucumber", "playwright"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
    "Environment :: Console",
]

dependencies = [
    "typer[all]>=0.9.0",
    "rich>=13.0.0",
    "lxml>=4.9.0",
]

[project.urls]
Homepage = "https://github.com/PanjatanCoders/flaktor"
Repository = "https://github.com/PanjatanCoders/flaktor"
Issues = "https://github.com/PanjatanCoders/flaktor/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
flaktor = "flaktor.cli:app"

[tool.setuptools]
packages = ["flaktor"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]