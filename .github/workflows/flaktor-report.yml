# Flaktor - Weekly flaky test report
# This workflow generates a weekly report of flaky tests and can create issues for the worst offenders.
#
# Usage:
#   1. Add this workflow to your repository at .github/workflows/flaktor-report.yml
#   2. The workflow runs weekly and posts a summary to GitHub Issues

name: Weekly Flaky Test Report

on:
  schedule:
    # Run every Monday at 9:00 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:  # Allow manual trigger

jobs:
  flaky-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Flaktor
        run: pip install flaktor

      # Restore the Flaktor database from cache
      - name: Restore Flaktor database
        uses: actions/cache@v4
        with:
          path: .flaktor
          key: flaktor-db-${{ github.repository }}
          restore-keys: |
            flaktor-db-

      - name: Check database exists
        id: check-db
        run: |
          if [ -f ".flaktor/flaktor.db" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Generate flaky test report
        if: steps.check-db.outputs.exists == 'true'
        id: report
        run: |
          # Generate the report
          flaktor report --days 7 --output weekly-report.txt

          # Get flaky test count
          FLAKY_COUNT=$(flaktor list --flaky --days 7 2>/dev/null | grep -c "%" || echo "0")
          echo "flaky_count=$FLAKY_COUNT" >> $GITHUB_OUTPUT

          # Get top 5 flakiest tests for the issue body
          flaktor list --flaky --days 7 --limit 5 > top-flaky.txt 2>/dev/null || echo "No flaky tests" > top-flaky.txt

      - name: Create or update flaky test issue
        if: steps.check-db.outputs.exists == 'true' && steps.report.outputs.flaky_count != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            // Read the reports
            const weeklyReport = fs.readFileSync('weekly-report.txt', 'utf8');
            const topFlaky = fs.readFileSync('top-flaky.txt', 'utf8');

            const issueTitle = '🔴 Weekly Flaky Test Report';
            const date = new Date().toISOString().split('T')[0];

            const issueBody = `## Flaky Test Report - ${date}

            This is an automated weekly report of flaky tests detected by Flaktor.

            ### Top Flaky Tests (Last 7 Days)

            \`\`\`
            ${topFlaky}
            \`\`\`

            ### Full Report

            <details>
            <summary>Click to expand full report</summary>

            \`\`\`
            ${weeklyReport}
            \`\`\`

            </details>

            ### Recommendations

            1. **Investigate** the top flaky tests listed above
            2. **Check** for race conditions, timing issues, or external dependencies
            3. **Consider** quarantining persistently flaky tests
            4. **Fix** or remove tests that cannot be stabilized

            ---
            *Generated by [Flaktor](https://github.com/PanjatanCoders/flaktor)*
            `;

            // Find existing open issue
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'flaky-tests',
              state: 'open'
            });

            if (issues.data.length > 0) {
              // Update existing issue
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues.data[0].number,
                body: issueBody
              });
              console.log(`Updated issue #${issues.data[0].number}`);
            } else {
              // Create new issue
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: issueTitle,
                body: issueBody,
                labels: ['flaky-tests', 'automated']
              });
              console.log('Created new flaky test issue');
            }

      - name: Upload report artifact
        if: steps.check-db.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: weekly-flaky-report
          path: weekly-report.txt
          retention-days: 90
